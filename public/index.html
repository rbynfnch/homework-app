<script>
  // All reads/writes go through /api/data (a Netlify Function), scoped
  // server-side to the logged-in user's family. A signed session cookie
  // (set on login/signup) is what ties requests to a family.
  const API_BASE = "api";

  window.storage = {
    async get(key) {
      const res = await fetch(`${API_BASE}/data?key=${encodeURIComponent(key)}`, { credentials: "include" });
      if (res.status === 401) {
        const err = new Error("Not logged in");
        err.status = 401;
        throw err;
      }
      if (!res.ok) return null;
      const json = await res.json();
      return json.value == null ? null : { key, value: json.value, shared: true };
    },
    async set(key, value) {
      const res = await fetch(`${API_BASE}/data`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ key, value }),
      });
      if (res.status === 401) {
        const err = new Error("Not logged in");
        err.status = 401;
        throw err;
      }
      return { key, value, shared: true };
    },
    async delete(key) {
      await fetch(`${API_BASE}/data?key=${encodeURIComponent(key)}`, {
        method: "DELETE",
        credentials: "include",
      });
      return { key, deleted: true, shared: true };
    },
    async list() {
      // Not used by this app (a single state blob per family) but kept
      // for interface compatibility.
      return { keys: [], shared: true };
    },
  };

  window.homeworkAuth = {
    async me() {
      const res = await fetch(`${API_BASE}/me`, { credentials: "include" });
      if (!res.ok) return null;
      const json = await res.json();
      return json.user || null;
    },
    async login(email, password) {
      const res = await fetch(`${API_BASE}/login`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || "Couldn't log in.");
      return json.user;
    },
    async register(payload) {
      const res = await fetch(`${API_BASE}/register`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || "Couldn't sign up.");
      return json.user;
    },
    async logout() {
      await fetch(`${API_BASE}/logout`, { method: "POST", credentials: "include" });
    },
  };
</script>

const DAY_CODES = ["MO", "TU", "WE", "TH", "FR", "SA", "SU"];
const DAY_JS_INDEX = { SU: 0, MO: 1, TU: 2, WE: 3, TH: 4, FR: 5, SA: 6 };
const DAY_LABELS = { MO: "M", TU: "T", WE: "W", TH: "T", FR: "F", SA: "S", SU: "S" };
const DAY_NAMES = { MO: "Mon", TU: "Tue", WE: "Wed", TH: "Thu", FR: "Fri", SA: "Sat", SU: "Sun" };

function noRepeat() {
  return { freq: "none", interval: 1, byDay: [], endType: "never", endCount: null, completedCount: 0 };
}

// Accepts either the old string-enum shape (from previously saved data) or the current object shape,
// and always returns the current object shape.
function migrateRepeat(old) {
  const base = noRepeat();
  if (!old || old === "none") return base;
  if (typeof old === "object") return { ...base, ...old };
  if (old === "daily") return { ...base, freq: "day", interval: 1 };
  if (old === "weekdays") return { ...base, freq: "week", interval: 1, byDay: ["MO", "TU", "WE", "TH", "FR"] };
  if (old === "weekly") return { ...base, freq: "week", interval: 1 };
  if (old === "biweekly") return { ...base, freq: "week", interval: 2 };
  if (old === "monthly") return { ...base, freq: "month", interval: 1 };
  if (old === "yearly") return { ...base, freq: "year", interval: 1 };
  const legacyWeekday = { "weekly-sun": "SU", "weekly-mon": "MO", "weekly-tue": "TU", "weekly-wed": "WE", "weekly-thu": "TH", "weekly-fri": "FR", "weekly-sat": "SA" };
  if (legacyWeekday[old]) return { ...base, freq: "week", interval: 1, byDay: [legacyWeekday[old]] };
  return base;
}

function ordinalSuffix(n) {
  if (n % 10 === 1 && n % 100 !== 11) return "st";
  if (n % 10 === 2 && n % 100 !== 12) return "nd";
  if (n % 10 === 3 && n % 100 !== 13) return "rd";
  return "th";
}
function ordinal(n) {
  return `${n}${ordinalSuffix(n)}`;
}

function describeRepeat(repeat, deadline) {
  if (!repeat || repeat.freq === "none") return null;
  const n = Math.max(1, repeat.interval || 1);
  const unitWord = { day: "day", week: "week", month: "month", year: "year" }[repeat.freq];
  let base;
  if (repeat.freq === "week" && repeat.byDay && repeat.byDay.length > 0) {
    const days = repeat.byDay.map((c) => DAY_NAMES[c]).join(", ");
    base = n === 1 ? `Every week on ${days}` : `Every ${n} weeks on ${days}`;
  } else if (repeat.freq === "month" && deadline) {
    const day = Number(deadline.slice(8, 10));
    const dayLabel = `the ${ordinal(day)}`;
    base = n === 1 ? `Every month on ${dayLabel}` : `Every ${n} months on ${dayLabel}`;
  } else if (repeat.freq === "year" && deadline) {
    const d = new Date(deadline + "T00:00:00");
    const monthName = d.toLocaleDateString("en-US", { month: "long" });
    const dateLabel = `${monthName} ${ordinal(d.getDate())}`;
    base = n === 1 ? `Every year on ${dateLabel}` : `Every ${n} years on ${dateLabel}`;
  } else {
    base = n === 1 ? `Every ${unitWord}` : `Every ${n} ${unitWord}s`;
  }
  if (repeat.endType === "count" && repeat.endCount) {
    base += `, ${repeat.endCount}x`;
  }
  return base;
}

function playDing() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.09);
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.32);
    o.connect(g);
    g.connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.34);
  } catch {
    // audio not available — fail silently
  }
}

    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.13, ctx.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.17);

}

function playCelebrate() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      const t0 = ctx.currentTime + i * 0.1;
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
      o.connect(g);
      g.connect(ctx.destination);
      o.start(t0);
      o.stop(t0 + 0.32);
    });
  } catch {
    // audio not available — fail silently
  }
}

// Finds the next date matching one of the given weekday codes, strictly after baseDateStr.
function nextMatchingWeekday(baseDateStr, byDayCodes) {
  const base = baseDateStr ? new Date(baseDateStr + "T00:00:00") : new Date(todayStr() + "T00:00:00");
  const targets = byDayCodes.map((c) => DAY_JS_INDEX[c]);
  const d = new Date(base);
  d.setDate(d.getDate() + 1);
  for (let i = 0; i < 8; i++) {
    if (targets.includes(d.getDay())) return d.toISOString().slice(0, 10);
    d.setDate(d.getDate() + 1);
  }
  return d.toISOString().slice(0, 10);
}

function addRepeatInterval(dateStr, repeat) {
  const n = Math.max(1, repeat.interval || 1);
  if (repeat.freq === "week" && repeat.byDay && repeat.byDay.length > 0) {
    return nextMatchingWeekday(dateStr, repeat.byDay);
  }
  const d = dateStr ? new Date(dateStr + "T00:00:00") : new Date();
  if (repeat.freq === "day") d.setDate(d.getDate() + n);
  else if (repeat.freq === "week") d.setDate(d.getDate() + 7 * n);
  else if (repeat.freq === "month") d.setMonth(d.getMonth() + n);
  else if (repeat.freq === "year") d.setFullYear(d.getFullYear() + n);
  return d.toISOString().slice(0, 10);
}

// For a fresh task with no deadline set yet, if specific weekdays were chosen, default the
// deadline to the soonest matching day so the recurrence has somewhere to start from.
function initialDeadlineForRepeat(repeat) {
  if (repeat.freq === "week" && repeat.byDay && repeat.byDay.length > 0) {
    const today = new Date(todayStr() + "T00:00:00");
    if (repeat.byDay.includes(DAY_CODES[(today.getDay() + 6) % 7])) return todayStr();
    return nextMatchingWeekday(todayStr(), repeat.byDay);
  }
  return null;
}

function deadlineInfo(deadline) {
  if (!deadline) return null;
  const today = new Date(todayStr() + "T00:00:00");
  const due = new Date(deadline + "T00:00:00");
  const diffDays = Math.round((due - today) / 86400000);
  if (diffDays < 0) return { label: `${Math.abs(diffDays)}d overdue`, tone: "danger" };
  if (diffDays === 0) return { label: "Due today", tone: "danger" };
  if (diffDays === 1) return { label: "Due tomorrow", tone: "warn" };
  if (diffDays <= 6) return { label: `Due in ${diffDays}d`, tone: "neutral" };
  const opts = { month: "short", day: "numeric" };
  return { label: due.toLocaleDateString(undefined, opts), tone: "neutral" };
}

function buildTodayEntries(categories) {
  const topLevel = categories.filter((c) => !c.parentId);
  const entries = [];
  topLevel.forEach((cat) => {
    const kids = categories.filter((c) => c.parentId === cat.id);
    if (kids.length === 0) {
      if (cat.visible) entries.push({ id: cat.id, name: cat.name, type: "leaf", category: cat });
    } else {
      const visibleKids = kids.filter((k) => k.visible);
      if (visibleKids.length > 0) entries.push({ id: cat.id, name: cat.name, type: "group", category: cat, children: visibleKids });
    }
  });
  return entries;
}

function AuthGate() {
  const [status, setStatus] = useState("checking"); // checking | authed | anon
  const [currentUser, setCurrentUser] = useState(null);

  useEffect(() => {
    let cancelled = false;
    window.homeworkAuth
      .me()
      .then((u) => {
        if (cancelled) return;
        if (u) {
          setCurrentUser(u);
          setStatus("authed");
        } else {
          setStatus("anon");
        }
      })
      .catch(() => {
        if (!cancelled) setStatus("anon");
      });
    return () => {
      cancelled = true;
    };
  }, []);

  const handleAuthed = (user) => {
    setCurrentUser(user);
    setStatus("authed");
  };

  const handleLogout = async () => {
    try {
      await window.homeworkAuth.logout();
    } catch {
      // fall through — clear local state regardless
    }
    setCurrentUser(null);
    setStatus("anon");
  };

  if (status === "checking") {
    return (
      <Shell mode="dark">
        <style>{FONT_IMPORT}</style>
        <div style={{ padding: "3rem 1rem", textAlign: "center", color: "var(--ink-soft)" }}>Loading…</div>
      </Shell>
    );
  }

  if (status === "anon") {
    return <AuthScreen onAuthed={handleAuthed} />;
  }

  return <TodayApp currentUser={currentUser} onLogout={handleLogout} />;
}

function TodayApp({ currentUser, onLogout }) {
  const [state, setState] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [modal, setModal] = useState(null);
  const [pendingUndo, setPendingUndo] = useState(null);
  const [celebration, setCelebration] = useState(null);
  const [showGreeting, setShowGreeting] = useState(false);
  const [pendingDragId, setPendingDragId] = useState(null);
  const [draggingId, setDraggingId] = useState(null);
  const [allTasksHidden, setAllTasksHidden] = useState(() => new Set());
  const [mode, setMode] = useState(getInitialMode);
  const [, forceDragTick] = useState(0);
  const saveTimer = useRef(null);
  const undoTimer = useRef(null);
  const celebrationTimer = useRef(null);
  const dragRef = useRef(null);
  const dropZoneRefs = useRef({});
  const rowDropZoneRefs = useRef({});
  const pendingDragRef = useRef(null);
  const pressTimerRef = useRef(null);

  const scheduleSave = useCallback((next) => {
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
      } catch {
        // silent — will retry on next change
      }
    }, 250);
  }, []);

  const persist = useCallback((next) => {
    setState(next);
    scheduleSave(next);
  }, [scheduleSave]);

  const loadExample = () => persist(seedState());
  const startEmpty = () => persist({ categories: [], tasks: {}, uncategorized: [], completedLog: [], lastSeenDate: null, completedRetentionDays: 60 });

  const toggleMode = () => {
    setMode((prev) => {
      const next = prev === "dark" ? "light" : "dark";
      try {
        localStorage.setItem(MODE_STORAGE_KEY, next);
      } catch {
        // localStorage unavailable — mode just won't persist across visits
      }
      return next;
    });
  };

  const triggerCelebration = (type, subjectName) => {
    if (celebrationTimer.current) clearTimeout(celebrationTimer.current);
    if (type === "subject") {
      const pick = SUBJECT_CELEBRATIONS[Math.floor(Math.random() * SUBJECT_CELEBRATIONS.length)];
      setCelebration({ id: uid(), type: "subject", title: pick(subjectName) });
      playCelebrate();
      if (navigator.vibrate) navigator.vibrate([15, 60, 15, 60, 30]);
      celebrationTimer.current = setTimeout(() => setCelebration(null), 3400);
    } else {
      const pick = TASK_CELEBRATIONS[Math.floor(Math.random() * TASK_CELEBRATIONS.length)];
      setCelebration({ id: uid(), type: "task", title: pick });
      celebrationTimer.current = setTimeout(() => setCelebration(null), 2000);
    }
  };

  const completeTask = (categoryId, taskId) => {
    if (undoTimer.current) clearTimeout(undoTimer.current);
    setState((prev) => {
      const cat = prev.categories.find((c) => c.id === categoryId);
      if (!cat) return prev;
      const task = prev.tasks[taskId];
      const newQueue = cat.queue.filter((id) => id !== taskId);
      const nextTasks = { ...prev.tasks };
      let cloneId = null;
      const rep = task.repeat && typeof task.repeat === "object" ? task.repeat : noRepeat();
      if (rep.freq !== "none") {
        const doneCount = (rep.completedCount || 0) + 1;
        const exhausted = rep.endType === "count" && rep.endCount && doneCount >= rep.endCount;
        if (!exhausted) {
          const clone = {
            ...task,
            id: uid(),
            deadline: task.deadline ? addRepeatInterval(task.deadline, rep) : null,
            repeat: { ...rep, completedCount: doneCount },
            createdAt: Date.now(),
          };
          nextTasks[clone.id] = clone;
          newQueue.push(clone.id);
          cloneId = clone.id;
        }
      }
      delete nextTasks[taskId];
      const nextCats = prev.categories.map((c) => (c.id === categoryId ? { ...c, queue: newQueue } : c));
      const logEntry = { id: uid(), taskId, title: task.title, categoryId, categoryName: cat.name, categoryColor: cat.color, completedAt: Date.now() };
      const nextLog = [logEntry, ...prev.completedLog];
      const next = { ...prev, categories: nextCats, tasks: nextTasks, completedLog: nextLog };
      scheduleSave(next);
      setPendingUndo({ categoryId, taskId, task, cloneId, logEntryId: logEntry.id });
      triggerCelebration(newQueue.length === 0 ? "subject" : "task", cat.name);
      return next;
    });
    undoTimer.current = setTimeout(() => setPendingUndo(null), 5000);
  };

  const undoComplete = () => {
    if (!pendingUndo) return;
    const { categoryId, taskId, task, cloneId, logEntryId } = pendingUndo;
    if (undoTimer.current) clearTimeout(undoTimer.current);
    if (celebrationTimer.current) clearTimeout(celebrationTimer.current);
    setCelebration(null);
    setState((prev) => {
      const nextTasks = { ...prev.tasks, [taskId]: task };
      if (cloneId) delete nextTasks[cloneId];
      const nextCats = prev.categories.map((c) => {
        if (c.id !== categoryId) return c;
        const q = c.queue.filter((id) => id !== cloneId);
        return { ...c, queue: [taskId, ...q] };
      });
      const nextLog = prev.completedLog.filter((e) => e.id !== logEntryId);
      const next = { ...prev, categories: nextCats, tasks: nextTasks, completedLog: nextLog };
      scheduleSave(next);
      return next;
    });
    setPendingUndo(null);
  };

  const moveToBottom = (categoryId, taskId) => {
    persist({ ...state, categories: state.categories.map((c) => (c.id === categoryId ? { ...c, queue: [...c.queue.filter((id) => id !== taskId), taskId] } : c)) });
  };

  const handleSkip = (categoryId, task) => {
    if (task.deadline) {
      setModal({ type: "skipDeadline", categoryId, task });
    } else {
      moveToBottom(categoryId, task.id);
    }
  };

  const updateTask = (taskId, updates) => {
    const nextTasks = { ...state.tasks, [taskId]: { ...state.tasks[taskId], ...updates } };
    persist({ ...state, tasks: nextTasks });
  };

  const saveTaskEdits = (taskId, { title, deadline, repeat, notes, categoryId, newCategoryName, newCategoryColor, newCategoryParentId }) => {
    const task = state.tasks[taskId];
    if (!task) return;

    let cats = state.categories;
    let targetCategoryId = categoryId;
    if (newCategoryName) {
      const newId = uid();
      cats = [...cats, { id: newId, name: newCategoryName, color: newCategoryColor, visible: true, queue: [], parentId: newCategoryParentId || null }];
      targetCategoryId = newId;
    }

    const currentCategoryId = task.categoryId ?? null;
    let nextUncategorized = state.uncategorized;

    if (targetCategoryId !== currentCategoryId) {
      if (currentCategoryId) {
        if (!targetCategoryId) nextUncategorized = [...nextUncategorized, taskId];
      } else {
        nextUncategorized = nextUncategorized.filter((id) => id !== taskId);
      }
      cats = cats.map((c) => {
        let queue = c.queue;
        if (c.id === currentCategoryId) queue = queue.filter((id) => id !== taskId);
        if (c.id === targetCategoryId) queue = [...queue, taskId];
        return queue === c.queue ? c : { ...c, queue };
      });
    }

    const nextTasks = {
      ...state.tasks,
      [taskId]: { ...task, title, deadline, repeat, notes, categoryId: targetCategoryId },
    };

    persist({ ...state, categories: cats, tasks: nextTasks, uncategorized: nextUncategorized });
  };

  const updateCategory = (categoryId, updates) => {
    persist({ ...state, categories: state.categories.map((c) => (c.id === categoryId ? { ...c, ...updates } : c)) });
  };

  const toggleAllTasksFilter = (id) => {
    setAllTasksHidden((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const addCategory = (name, color) => {
    const id = uid();
    persist({ ...state, categories: [...state.categories, { id, name, color, visible: true, queue: [], parentId: null }] });
    return id;
  };

  const addSubcategory = (parentId, name, color) => {
    const id = uid();
    persist({ ...state, categories: [...state.categories, { id, name, color, visible: true, queue: [], parentId }] });
    return id;
  };

  const convertToGroup = (categoryId, subName, subColor) => {
    const parent = state.categories.find((c) => c.id === categoryId);
    if (!parent) return;
    const subId = uid();
    const newSub = { id: subId, name: subName, color: subColor, visible: true, queue: parent.queue, parentId: categoryId };
    const nextCategories = state.categories.map((c) => (c.id === categoryId ? { ...c, queue: [] } : c)).concat([newSub]);
    persist({ ...state, categories: nextCategories });
    return subId;
  };

  const addOrConvertSubcategory = (categoryId, name, color) => {
    const hasChildren = state.categories.some((c) => c.parentId === categoryId);
    if (hasChildren) addSubcategory(categoryId, name, color);
    else convertToGroup(categoryId, name, color);
  };

  const deleteCategory = (categoryId) => {
    const cat = state.categories.find((c) => c.id === categoryId);
    if (!cat) return;
    const childIds = state.categories.filter((c) => c.parentId === categoryId).map((c) => c.id);
    const removeIds = [categoryId, ...childIds];
    const nextTasks = { ...state.tasks };
    removeIds.forEach((id) => {
      const c = state.categories.find((cc) => cc.id === id);
      if (c) c.queue.forEach((tid) => delete nextTasks[tid]);
    });
    persist({ ...state, categories: state.categories.filter((c) => !removeIds.includes(c.id)), tasks: nextTasks });
  };

  const toggleVisible = (categoryId) => {
    persist({ ...state, categories: state.categories.map((c) => (c.id === categoryId ? { ...c, visible: !c.visible } : c)) });
  };

  const addTask = ({ categoryId, newCategoryName, newCategoryColor, newCategoryParentId, title, deadline, repeat, notes }) => {
    let catId = categoryId;
    let cats = state.categories;
    if (!catId && newCategoryName) {
      catId = uid();
      cats = [...cats, { id: catId, name: newCategoryName, color: newCategoryColor, visible: true, queue: [], parentId: newCategoryParentId || null }];
    }
    if (!catId) return;
    const task = { id: uid(), categoryId: catId, title, deadline: deadline || null, repeat: repeat || "none", notes: notes || "", createdAt: Date.now() };
    const nextTasks = { ...state.tasks, [task.id]: task };
    const nextCats = cats.map((c) => (c.id === catId ? { ...c, queue: [...c.queue, task.id] } : c));
    persist({ ...state, categories: nextCats, tasks: nextTasks });
  };

  const deleteTask = (categoryId, taskId) => {
    const nextTasks = { ...state.tasks };
    delete nextTasks[taskId];
    const nextCats = state.categories.map((c) => (c.id === categoryId ? { ...c, queue: c.queue.filter((id) => id !== taskId) } : c));
    persist({ ...state, categories: nextCats, tasks: nextTasks });
  };

  const reorderTaskQueue = (categoryId, newOrderIds) => {
    persist({ ...state, categories: state.categories.map((c) => (c.id === categoryId ? { ...c, queue: newOrderIds } : c)) });
  };

  const reorderSubcategories = (parentId, newOrderIds) => {
    const childById = Object.fromEntries(state.categories.filter((c) => c.parentId === parentId).map((c) => [c.id, c]));
    const reorderedChildren = newOrderIds.map((id) => childById[id]).filter(Boolean);
    const result = [];
    let inserted = false;
    state.categories.forEach((c) => {
      if (c.parentId === parentId) {
        if (!inserted) {
          result.push(...reorderedChildren);
          inserted = true;
        }
      } else {
        result.push(c);
      }
    });
    persist({ ...state, categories: result });
  };

  const reorderCategories = (newVisibleTopIds) => {
    const topLevel = state.categories.filter((c) => !c.parentId);
    const hiddenTop = topLevel.filter((c) => !newVisibleTopIds.includes(c.id));
    const orderedTopIds = [...newVisibleTopIds, ...hiddenTop.map((c) => c.id)];
    const byId = Object.fromEntries(state.categories.map((c) => [c.id, c]));
    const childrenOf = (pid) => state.categories.filter((c) => c.parentId === pid);
    const newArray = [];
    orderedTopIds.forEach((id) => {
      const cat = byId[id];
      if (!cat) return;
      newArray.push(cat);
      childrenOf(id).forEach((ch) => newArray.push(ch));
    });
    persist({ ...state, categories: newArray });
  };

  const applyDueFilter = (mode) => {
    const isLeaf = (c) => !state.categories.some((cc) => cc.parentId === c.id);
    const nextCats = state.categories.map((c) => {
      if (!isLeaf(c)) return c;
      if (mode === "all") return { ...c, visible: true };
      const days = mode === "today" ? 0 : mode === "week" ? 7 : 30;
      const front = c.queue[0] ? state.tasks[c.queue[0]] : null;
      if (!front || !front.deadline) return { ...c, visible: false };
      const diff = Math.round((new Date(front.deadline + "T00:00:00") - new Date(todayStr() + "T00:00:00")) / 86400000);
      return { ...c, visible: diff <= days };
    });
    persist({ ...state, categories: nextCats });
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `homework-backup-${todayStr()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const importData = (file) => {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && typeof parsed === "object" && parsed.categories && parsed.tasks) {
            parsed.uncategorized = parsed.uncategorized || [];
            parsed.completedLog = parsed.completedLog || [];
            parsed.completedRetentionDays = parsed.completedRetentionDays !== undefined ? parsed.completedRetentionDays : 60;
            Object.values(parsed.tasks).forEach((t) => { t.repeat = migrateRepeat(t.repeat); });
            persist(parsed);
            resolve({ ok: true });
          } else {
            resolve({ ok: false, message: "That file doesn't look like a Today backup." });
          }
        } catch {
          resolve({ ok: false, message: "Couldn't read that file." });
        }
      };
      reader.onerror = () => resolve({ ok: false, message: "Couldn't read that file." });
      reader.readAsText(file);
    });
  };

  const brainDump = (lines) => {
    const nextTasks = { ...state.tasks };
    const newIds = [];
    lines.forEach((title) => {
      const t = { id: uid(), categoryId: null, title, notes: "", deadline: null, repeat: noRepeat(), createdAt: Date.now() };
      nextTasks[t.id] = t;
      newIds.push(t.id);
    });
    persist({ ...state, tasks: nextTasks, uncategorized: [...state.uncategorized, ...newIds] });
  };

  const removeUncategorized = (taskId) => {
    const nextTasks = { ...state.tasks };
    delete nextTasks[taskId];
    persist({ ...state, tasks: nextTasks, uncategorized: state.uncategorized.filter((id) => id !== taskId) });
  };

  const readdFromCompleted = (entry) => {
    const catExists = state.categories.some((c) => c.id === entry.categoryId);
    const task = { id: uid(), categoryId: catExists ? entry.categoryId : null, title: entry.title, notes: "", deadline: null, repeat: noRepeat(), createdAt: Date.now() };
    const nextTasks = { ...state.tasks, [task.id]: task };
    if (catExists) {
      const nextCategories = state.categories.map((c) => (c.id === entry.categoryId ? { ...c, queue: [...c.queue, task.id] } : c));
      persist({ ...state, tasks: nextTasks, categories: nextCategories });
    } else {
      persist({ ...state, tasks: nextTasks, uncategorized: [...state.uncategorized, task.id] });
    }
  };

  const updateRetention = (days) => {
    const cutoff = days ? Date.now() - days * 86400000 : null;
    const nextLog = cutoff ? state.completedLog.filter((e) => e.completedAt >= cutoff) : state.completedLog;
    persist({ ...state, completedRetentionDays: days, completedLog: nextLog });
  };

  const assignTaskCategory = (taskId, categoryId) => {
    reassignTask(taskId, null, categoryId);
  };

  const reassignTask = (taskId, fromCategoryId, toCategoryId) => {
    if (fromCategoryId === toCategoryId) return;
    let nextUncategorized = state.uncategorized;
    if (fromCategoryId) {
      if (!toCategoryId) nextUncategorized = [...nextUncategorized, taskId];
    } else {
      nextUncategorized = nextUncategorized.filter((id) => id !== taskId);
    }
    const nextCategories = state.categories.map((c) => {
      let queue = c.queue;
      if (c.id === fromCategoryId) queue = queue.filter((id) => id !== taskId);
      if (c.id === toCategoryId) queue = [...queue, taskId];
      return queue === c.queue ? c : { ...c, queue };
    });
    const nextTasks = { ...state.tasks, [taskId]: { ...state.tasks[taskId], categoryId: toCategoryId } };
    persist({ ...state, uncategorized: nextUncategorized, categories: nextCategories, tasks: nextTasks });
  };

  const createCategoryAndAssign = (name, color, taskId) => {
    const id = uid();
    const nextCategories = [...state.categories, { id, name, color, visible: true, queue: [taskId], parentId: null }];
    const nextUncategorized = state.uncategorized.filter((tid) => tid !== taskId);
    persist({ ...state, categories: nextCategories, uncategorized: nextUncategorized });
  };

  const registerDropZone = (categoryId, el) => {
    dropZoneRefs.current[categoryId] = el;
  };

  const registerRowDropZone = (taskId, el) => {
    if (el) rowDropZoneRefs.current[taskId] = el;
    else delete rowDropZoneRefs.current[taskId];
  };

  const startDrag = (task, x, y, opts = {}) => {
    if (pressTimerRef.current) clearTimeout(pressTimerRef.current);
    pendingDragRef.current = { task, opts, startX: x, startY: y };
    setPendingDragId(task.id);
  };

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        const raw = res ? JSON.parse(res.value) : null;
        if (raw) {
          raw.uncategorized = raw.uncategorized || [];
          raw.completedLog = raw.completedLog || [];
          raw.completedRetentionDays = raw.completedRetentionDays !== undefined ? raw.completedRetentionDays : 60;
          if (raw.tasks) {
            Object.values(raw.tasks).forEach((t) => { t.repeat = migrateRepeat(t.repeat); });
          }
        }
        setState(raw);
      } catch {
        setState(null);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  useEffect(() => {
    if (!loaded || !state) return;
    const today = todayStr();
    if (state.lastSeenDate !== today) {
      setShowGreeting(true);
      persist({ ...state, lastSeenDate: today });
      const t = setTimeout(() => setShowGreeting(false), 7000);
      return () => clearTimeout(t);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, state?.lastSeenDate]);

  useEffect(() => {
    if (!loaded) return;
    setState((prev) => {
      if (!prev) return prev;
      const days = prev.completedRetentionDays;
      if (!days) return prev;
      const cutoff = Date.now() - days * 86400000;
      const trimmed = prev.completedLog.filter((e) => e.completedAt >= cutoff);
      if (trimmed.length === prev.completedLog.length) return prev;
      const next = { ...prev, completedLog: trimmed };
      scheduleSave(next);
      return next;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  useEffect(() => {
    if (!pendingDragId) return;
    const pending = pendingDragRef.current;
    if (!pending) return;

    const finishPending = () => {
      if (pressTimerRef.current) { clearTimeout(pressTimerRef.current); pressTimerRef.current = null; }
      pendingDragRef.current = null;
      setPendingDragId(null);
    };

    pressTimerRef.current = setTimeout(() => {
      pressTimerRef.current = null;
      const p = pendingDragRef.current;
      if (!p) return;
      dragRef.current = { taskId: p.task.id, task: p.task, title: p.task.title, x: p.startX, y: p.startY, startX: p.startX, startY: p.startY, fromCategoryId: p.opts.fromCategoryId ?? null, onTap: p.opts.onTap };
      if (navigator.vibrate) navigator.vibrate(12);
      pendingDragRef.current = null;
      setPendingDragId(null);
      setDraggingId(p.task.id);
    }, LONG_PRESS_MS);

    const handleMove = (e) => {
      const dist = Math.hypot(e.clientX - pending.startX, e.clientY - pending.startY);
      if (dist > PRESS_CANCEL_PX) finishPending();
    };
    const handleUp = () => {
      const wasPending = !!pressTimerRef.current;
      finishPending();
      if (wasPending) pending.opts.onTap?.();
    };
    const handleCancel = () => finishPending();

    window.addEventListener("pointermove", handleMove);
    window.addEventListener("pointerup", handleUp);
    window.addEventListener("pointercancel", handleCancel);
    return () => {
      if (pressTimerRef.current) { clearTimeout(pressTimerRef.current); pressTimerRef.current = null; }
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("pointerup", handleUp);
      window.removeEventListener("pointercancel", handleCancel);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [pendingDragId]);

  useEffect(() => {
    if (!draggingId) return;
    let scrollRaf = null;
    let scrollSpeed = 0;

    const runAutoScroll = () => {
      if (scrollSpeed !== 0) {
        const target = document.querySelector(".sheet, .pageBody");
        if (target) target.scrollBy(0, scrollSpeed);
        else window.scrollBy(0, scrollSpeed);
        scrollRaf = requestAnimationFrame(runAutoScroll);
      } else {
        scrollRaf = null;
      }
    };

    const updateAutoScroll = (clientY) => {
      const margin = 90;
      const vh = window.innerHeight;
      if (clientY < margin) {
        scrollSpeed = -Math.ceil((margin - clientY) / 4) - 2;
      } else if (clientY > vh - margin) {
        scrollSpeed = Math.ceil((margin - (vh - clientY)) / 4) + 2;
      } else {
        scrollSpeed = 0;
      }
      if (scrollSpeed !== 0 && scrollRaf == null) scrollRaf = requestAnimationFrame(runAutoScroll);
    };

    const cleanupDrag = () => {
      scrollSpeed = 0;
      if (scrollRaf != null) { cancelAnimationFrame(scrollRaf); scrollRaf = null; }
      dragRef.current = null;
      setDraggingId(null);
    };

    const handleMove = (e) => {
      if (!dragRef.current) return;
      e.preventDefault();
      dragRef.current.x = e.clientX;
      dragRef.current.y = e.clientY;
      forceDragTick((t) => t + 1);
      updateAutoScroll(e.clientY);
    };
    const handleTouchMove = (e) => {
      if (!dragRef.current) return;
      e.preventDefault();
      const t = e.touches[0];
      if (!t) return;
      dragRef.current.x = t.clientX;
      dragRef.current.y = t.clientY;
      forceDragTick((tk) => tk + 1);
      updateAutoScroll(t.clientY);
    };
    const handleUp = (e) => {
      const info = dragRef.current;
      cleanupDrag();
      if (!info) return;

      let targetId = null;
      Object.keys(dropZoneRefs.current).forEach((catId) => {
        const el = dropZoneRefs.current[catId];
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) targetId = catId;
      });

      if (targetId && targetId === info.fromCategoryId) {
        // Dropped back within the same category's section — reorder within it based on where
        // the drop point falls relative to the other rows, without requiring a precise row hit.
        const cat = state.categories.find((c) => c.id === targetId);
        if (cat) {
          const rest = cat.queue.filter((id) => id !== info.taskId);
          let targetIndex = rest.length;
          for (let i = 0; i < rest.length; i++) {
            const rowEl = rowDropZoneRefs.current[rest[i]];
            if (!rowEl) continue;
            const r = rowEl.getBoundingClientRect();
            const mid = r.top + r.height / 2;
            if (e.clientY < mid) { targetIndex = i; break; }
          }
          const newQueue = [...rest];
          newQueue.splice(targetIndex, 0, info.taskId);
          const changed = newQueue.length !== cat.queue.length || newQueue.some((id, i) => id !== cat.queue[i]);
          if (changed) reorderTaskQueue(targetId, newQueue);
        }
        return;
      }

      if (targetId) reassignTask(info.taskId, info.fromCategoryId, targetId === "__uncategorized__" ? null : targetId);
    };
    const handleCancel = () => cleanupDrag();

    window.addEventListener("pointermove", handleMove, { passive: false });
    window.addEventListener("touchmove", handleTouchMove, { passive: false });
    window.addEventListener("pointerup", handleUp);
    window.addEventListener("pointercancel", handleCancel);
    return () => {
      window.removeEventListener("pointermove", handleMove);
      window.removeEventListener("touchmove", handleTouchMove);
      window.removeEventListener("pointerup", handleUp);
      window.removeEventListener("pointercancel", handleCancel);
      if (scrollRaf != null) cancelAnimationFrame(scrollRaf);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [draggingId]);

  if (!loaded) {
    return <Shell mode={mode}><div style={{ padding: "3rem 1rem", textAlign: "center", color: "var(--ink-soft)" }}>Loading…</div></Shell>;
  }

  if (!state) {
    return (
      <Shell mode={mode}>
        <OnboardScreen onExample={loadExample} onEmpty={startEmpty} />
      </Shell>
    );
  }

  const entries = buildTodayEntries(state.categories);

  const completedToday = state.completedLog.filter((e) => new Date(e.completedAt).toDateString() === new Date().toDateString()).length;
  const remainingActive = entries.reduce((sum, e) => {
    if (e.type === "leaf") return sum + (e.category.queue.length > 0 ? 1 : 0);
    return sum + e.children.filter((k) => k.queue.length > 0).length;
  }, 0);
  const totalToday = completedToday + remainingActive;

  const hoveredCategoryId = draggingId && dragRef.current
    ? Object.keys(dropZoneRefs.current).find((id) => {
        const el = dropZoneRefs.current[id];
        if (!el) return false;
        const r = el.getBoundingClientRect();
        return dragRef.current.x >= r.left && dragRef.current.x <= r.right && dragRef.current.y >= r.top && dragRef.current.y <= r.bottom;
      })
    : null;

  return (
    <Shell mode={mode}>
      <style>{FONT_IMPORT}</style>
      <Header
        onSettings={() => setModal({ type: "today" })}
        onManage={() => setModal({ type: "manage" })}
        onOpenAccount={() => setModal({ type: "account" })}
        currentUser={currentUser}
        mode={mode}
        onToggleMode={toggleMode}
      />

      {pendingUndo && (
        <div className="undoBar">
          <span>Assignment turned in.</span>
          <button className="undoBtn" onClick={undoComplete}>Undo</button>
        </div>
      )}

      {celebration?.type === "task" && (
        <div className="celebrationToast" key={celebration.id}>
          <Sparkles size={15} />
          <span>{celebration.title}</span>
        </div>
      )}

      {celebration?.type === "subject" && (
        <div className="celebrationBackdrop" onClick={() => setCelebration(null)}>
          <div className="celebrationCard" key={celebration.id}>
            <div className="confettiWrap">
              {CONFETTI_COLORS.map((color, i) => (
                <span
                  key={i}
                  className="confettiPiece"
                  style={{ left: `${6 + i * 11}%`, background: color, animationDelay: `${(i % 5) * 0.12}s` }}
                />
              ))}
            </div>
            <div className="celebrationEmoji">🎉</div>
            <h2 className="celebrationTitle">{celebration.title}</h2>
            <p className="celebrationSubtitle">Every assignment in this class is checked off.</p>
            <button className="primaryBtn" onClick={() => setCelebration(null)}>Nice!</button>
          </div>
        </div>
      )}

      <div className="stack">
        {showGreeting && (
          <div className="greetingBanner">
            <Sun size={16} />
            <span>{greetingText()}, here's what you're focusing on today.</span>
            <button className="greetingClose" onClick={() => setShowGreeting(false)} aria-label="Dismiss"><X size={14} /></button>
          </div>
        )}

        {totalToday > 0 && (
          <div className="progressWrap">
            <div className="progressBar"><div className="progressFill" style={{ width: `${Math.round((completedToday / totalToday) * 100)}%` }} /></div>
            <span className="progressLabel">{completedToday} of {totalToday} done today</span>
          </div>
        )}

        {state.categories.length === 0 && state.uncategorized.length === 0 && (
          <EmptyState
            title="No class subjects yet"
            body="Add a class subject and its first assignment will show up here."
            actionLabel="Add an assignment"
            onAction={() => setModal({ type: "addTask" })}
          />
        )}

        {state.categories.length > 0 && entries.length === 0 && (
          <EmptyState
            title="Nothing selected for today"
            body="Choose which class subjects you want to see right now."
            actionLabel="Choose class subjects"
            onAction={() => setModal({ type: "today" })}
          />
        )}

        {entries.length > 0 && (
          <ReorderableCategoryList
            items={entries}
            onReorder={reorderCategories}
            renderItem={(entry) =>
              entry.type === "leaf" ? (
                <div ref={(el) => registerDropZone(entry.category.id, el)} className={hoveredCategoryId === entry.category.id ? "dropTargetActive" : ""}>
                  <CategoryStack
                    category={entry.category}
                    tasks={state.tasks}
                    onComplete={(taskId) => completeTask(entry.category.id, taskId)}
                    onSkip={(task) => handleSkip(entry.category.id, task)}
                    onOpenTask={(task) => setModal({ type: "editTask", task })}
                    onAddTask={() => setModal({ type: "addTask", categoryId: entry.category.id })}
                    onOpenQueue={() => setModal({ type: "manageCategory", categoryId: entry.category.id })}
                    onStartDrag={startDrag}
                    draggingId={draggingId}
                  />
                </div>
              ) : (
                <GroupBlock
                  parent={entry.category}
                  children={entry.children}
                  tasks={state.tasks}
                  onComplete={(childId, taskId) => completeTask(childId, taskId)}
                  onSkip={(childId, task) => handleSkip(childId, task)}
                  onOpenTask={(task) => setModal({ type: "editTask", task })}
                  onAddTask={(childId) => setModal({ type: "addTask", categoryId: childId })}
                  onOpenQueue={(childId) => setModal({ type: "manageCategory", categoryId: childId })}
                  onOpenGroup={() => setModal({ type: "manageCategory", categoryId: entry.category.id })}
                  registerDropZone={registerDropZone}
                  hoveredCategoryId={hoveredCategoryId}
                  onStartDrag={startDrag}
                  draggingId={draggingId}
                />
              )
            }
          />
        )}

        <UncategorizedSection
          tasks={state.tasks}
          taskIds={state.uncategorized}
          onStartDrag={(t, x, y) => startDrag(t, x, y, { fromCategoryId: null, onTap: () => setModal({ type: "assignCategory", task: t }) })}
          onDelete={(taskId) => setModal({ type: "confirmDeleteTask", task: state.tasks[taskId], onConfirm: () => removeUncategorized(taskId), returnTo: null })}
          draggingId={draggingId}
        />
      </div>

      <div className="fabRow">
        <button className="fabSecondary" onClick={() => setModal({ type: "allTasks" })} aria-label="See all assignments">
          <ClipboardList size={21} />
        </button>
        <button className="fabSecondary" onClick={() => setModal({ type: "completedHistory", filter: "today" })} aria-label="Completed assignments">
          <ClipboardCheck size={21} />
        </button>
        <button className="fabSecondary" onClick={() => setModal({ type: "brainDump" })} aria-label="Brain dump">
          <Zap size={22} />
        </button>
        <button className="fab" onClick={() => setModal({ type: "addTask" })} aria-label="Add assignment">
          <Plus size={24} strokeWidth={2.25} />
        </button>
      </div>

      {draggingId && dragRef.current && (
        <div className="dragGhost" style={{ left: dragRef.current.x, top: dragRef.current.y }}>
          {dragRef.current.title}
        </div>
      )}

      {modal?.type === "addTask" && (
        <TaskModal
          categories={state.categories}
          initialCategoryId={modal.categoryId}
          onClose={() => setModal(modal.returnTo || null)}
          onSubmit={(data) => { addTask(data); setModal(modal.returnTo || null); }}
        />
      )}

      {modal?.type === "editTask" && (
        <TaskDetailModal
          task={modal.task}
          category={state.categories.find((c) => c.id === modal.task.categoryId)}
          categories={state.categories}
          onClose={() => setModal(modal.returnTo || null)}
          onRequestDelete={() => setModal({
            type: "confirmDeleteTask",
            task: modal.task,
            onConfirm: () => deleteTask(modal.task.categoryId, modal.task.id),
            returnTo: { type: "editTask", task: modal.task, returnTo: modal.returnTo },
            afterConfirm: modal.returnTo || null,
          })}
          onComplete={() => { completeTask(modal.task.categoryId, modal.task.id); setModal(modal.returnTo || null); }}
          onSave={(updates) => { saveTaskEdits(modal.task.id, updates); setModal(modal.returnTo || null); }}
        />
      )}

      {modal?.type === "confirmDeleteTask" && (
        <ConfirmDeleteTaskModal
          task={modal.task}
          onCancel={() => setModal(modal.returnTo || null)}
          onConfirm={() => { modal.onConfirm(); setModal(modal.afterConfirm !== undefined ? modal.afterConfirm : (modal.returnTo || null)); }}
        />
      )}

      {modal?.type === "skipDeadline" && (
        <SkipDeadlineModal
          task={modal.task}
          onCancel={() => setModal(null)}
          onKeepAndSkip={() => { moveToBottom(modal.categoryId, modal.task.id); setModal(null); }}
          onUpdateAndSkip={(newDate) => { updateTask(modal.task.id, { deadline: newDate }); moveToBottom(modal.categoryId, modal.task.id); setModal(null); }}
        />
      )}

      {modal?.type === "today" && (
        <TodaySelectorModal
          categories={state.categories}
          tasks={state.tasks}
          onToggle={toggleVisible}
          onApplyFilter={applyDueFilter}
          onClose={() => setModal(null)}
        />
      )}

      {modal?.type === "allTasks" && (
        <AllTasksModal
          categories={state.categories}
          tasks={state.tasks}
          uncategorizedIds={state.uncategorized}
          onBack={() => setModal(null)}
          onOpenTask={(task) => setModal({ type: "editTask", task })}
          onStartDrag={startDrag}
          registerDropZone={registerDropZone}
          registerRowDropZone={registerRowDropZone}
          hoveredCategoryId={hoveredCategoryId}
          draggingId={draggingId}
          onAssignUncategorized={(task) => setModal({ type: "assignCategory", task, returnTo: { type: "allTasks" } })}
          hiddenIds={allTasksHidden}
          onOpenFilter={() => setModal({ type: "allTasksFilter", returnTo: { type: "allTasks" } })}
          onShowAll={() => setAllTasksHidden(new Set())}
        />
      )}

      {modal?.type === "allTasksFilter" && (
        <AllTasksFilterModal
          categories={state.categories}
          hiddenIds={allTasksHidden}
          onToggle={toggleAllTasksFilter}
          onShowAll={() => setAllTasksHidden(new Set())}
          onClose={() => setModal(modal.returnTo || { type: "allTasks" })}
        />
      )}

      {modal?.type === "completedHistory" && (
        <CompletedHistoryModal
          log={state.completedLog}
          categories={state.categories}
          initialFilter={modal.filter}
          onBack={() => setModal(null)}
          onReadd={readdFromCompleted}
          retentionDays={state.completedRetentionDays}
          onUpdateRetention={updateRetention}
        />
      )}

      {modal?.type === "brainDump" && (
        <BrainDumpModal onClose={() => setModal(null)} onSubmit={(lines) => { brainDump(lines); setModal(null); }} />
      )}

      {modal?.type === "assignCategory" && modal.task && (
        <AssignCategoryModal
          task={modal.task}
          categories={state.categories}
          onAssign={(categoryId) => { assignTaskCategory(modal.task.id, categoryId); setModal(modal.returnTo || null); }}

function ReorderableCategoryList({ items, onReorder, renderItem }) {
  const [order, setOrder] = useState(items.map((it) => it.id));
  const [dragId, setDragId] = useState(null);
  const [dragOffset, setDragOffset] = useState(0);
  const dragInfo = useRef(null);
  const itemRefs = useRef({});
  const prevTopsRef = useRef({});

  useEffect(() => {
    setOrder((prev) => {
      const incoming = items.map((it) => it.id);
      const same = prev.length === incoming.length && prev.every((id, i) => id === incoming[i]);
      return same ? prev : incoming;
    });
  }, [items]);

  useLayoutEffect(() => {
    const newTops = {};
    order.forEach((id) => {
      const el = itemRefs.current[id];
      if (el) newTops[id] = el.getBoundingClientRect().top;
    });
    order.forEach((id) => {
      if (id === dragId) return;
      const el = itemRefs.current[id];
      if (!el) return;
      const prevTop = prevTopsRef.current[id];
      const newTop = newTops[id];
      if (prevTop != null && newTop != null && prevTop !== newTop) {
        const deltaY = prevTop - newTop;
        el.style.transition = "none";
        el.style.transform = `translateY(${deltaY}px)`;
        requestAnimationFrame(() => {
          el.style.transition = "transform 0.22s ease";
          el.style.transform = "";
        });
      }
    });
    prevTopsRef.current = newTops;
  }, [order, dragId]);

  const byId = Object.fromEntries(items.map((it) => [it.id, it]));

  const onHandleDown = (id, clientY) => {
    const idx = order.indexOf(id);
    const el = itemRefs.current[id];
    const step = (el?.offsetHeight || 90) + 22;
    dragInfo.current = { id, startY: clientY, startIndex: idx, step, order: [...order] };
    setDragId(id);
    setDragOffset(0);
  };

  const onMove = (clientY) => {
    const info = dragInfo.current;
    if (!info) return;
    const delta = clientY - info.startY;
    const rawShift = Math.round(delta / info.step);
    const targetIndex = Math.min(Math.max(info.startIndex + rawShift, 0), info.order.length - 1);
    const actualShift = targetIndex - info.startIndex;
    setDragOffset(delta - actualShift * info.step);
    const without = info.order.filter((id) => id !== info.id);
    without.splice(targetIndex, 0, info.id);
    setOrder((prev) => {
      const same = prev.length === without.length && prev.every((id, i) => id === without[i]);
      return same ? prev : without;
    });
  };

  const endDrag = () => {
    if (dragInfo.current) {
      const changed = order.length !== dragInfo.current.order.length || order.some((id, i) => id !== dragInfo.current.order[i]);
      if (changed) onReorder(order);
    }
    dragInfo.current = null;
    setDragId(null);
    setDragOffset(0);
  };

  return (
    <>
      {order.map((id) => {
        const item = byId[id];
        if (!item) return null;
        const dragging = dragId === id;
        return (
          <div
            key={id}
            ref={(el) => (itemRefs.current[id] = el)}
            className={"dragItem" + (dragging ? " dragItemActive" : "")}
            style={dragging ? { transform: `translateY(${dragOffset}px)`, zIndex: 30 } : undefined}
          >
            <button
              className="dragHandle"
              aria-label={`Reorder ${item.name}`}
              onMouseDown={(e) => onHandleDown(id, e.clientY)}
              onMouseMove={(e) => dragId === id && onMove(e.clientY)}
              onMouseUp={endDrag}
              onMouseLeave={() => dragId === id && endDrag()}
              onTouchStart={(e) => onHandleDown(id, e.touches[0].clientY)}
              onTouchMove={(e) => { if (dragId === id) onMove(e.touches[0].clientY); }}
              onTouchEnd={endDrag}
            >
              <GripVertical size={15} />
            </button>
            <div className="dragContent">{renderItem(item)}</div>
          </div>
        );
      })}
    </>
  );
}

function SwipeCard({ task, colorKey, onComplete, onSkip, onOpen, onStartCategoryDrag, armed }) {
  const c = PALETTE[colorKey] || PALETTE.teal;
  const [dx, setDx] = useState(0);
  const [dragging, setDragging] = useState(false);
  const [leaving, setLeaving] = useState(false);
  const [completing, setCompleting] = useState(false);
  const [skipping, setSkipping] = useState(false);
  const start = useRef(null);
  const moved = useRef(false);

  const onDown = (clientX, clientY) => {
    start.current = clientX;
    moved.current = false;
    setDragging(true);
    onStartCategoryDrag?.(clientX, clientY);
  };
  const onMove = (clientX) => {
    if (armed) return;
    if (start.current == null) return;
    const delta = clientX - start.current;
    if (Math.abs(delta) > 4) moved.current = true;
    setDx(delta);
  };

  const triggerComplete = () => {
    setDragging(false);
    setCompleting(true);
    playDing();
    if (navigator.vibrate) navigator.vibrate(15);
    setTimeout(() => {
      setLeaving(true);
      setTimeout(onComplete, 240);
    }, 300);
  };

  const triggerSkip = () => {
    setDragging(false);
    setSkipping(true);
    playBump();
    if (navigator.vibrate) navigator.vibrate(8);
    setTimeout(() => {
      setSkipping(false);
      setDx(0);
      onSkip(task);
    }, 320);
  };

  const onUp = () => {
    if (armed) { setDragging(false); start.current = null; return; }
    if (dx > 90) triggerComplete();
    else if (dx < -90) triggerSkip();
    else { setDragging(false); setDx(0); }
    start.current = null;
  };

  const info = deadlineInfo(task.deadline);

  const style = armed
    ? { transform: "scale(0.96)", opacity: 0.45, transition: "transform 0.15s ease, opacity 0.15s ease" }
    : {
        transform: `translateX(${leaving ? 420 : dx}px) rotate(${(leaving ? 420 : dx) / 24}deg)`,
        opacity: leaving ? 0 : 1,
        transition: dragging ? "none" : "transform 0.28s cubic-bezier(.2,.8,.2,1), opacity 0.28s",
      };

  return (
    <div
      className={"taskCard" + (armed ? " taskCardArmed" : "")}
      style={style}
      onMouseDown={(e) => onDown(e.clientX, e.clientY)}
      onMouseMove={(e) => dragging && onMove(e.clientX)}
      onMouseUp={onUp}
      onMouseLeave={() => dragging && onUp()}
      onTouchStart={(e) => onDown(e.touches[0].clientX, e.touches[0].clientY)}
      onTouchMove={(e) => onMove(e.touches[0].clientX)}
      onTouchEnd={onUp}
      onClick={() => !moved.current && !armed && onOpen()}
    >
      <div className="taskCardBar" style={{ background: c.solid }} />
      <div className="taskCardBody">
        <div className="taskTitleRow">
          <p className="taskTitle">{task.title}</p>
          <div className="swipeHintIcons">
            <span className="swipeHintIconGroup" title="Swipe left to skip">
              <ChevronsLeft size={13} />
              <SkipArcIcon size={18} />
            </span>
            <span className="swipeHintIconGroup" title="Swipe right to complete" style={{ color: c.solid }}>
              <CheckSquareIcon size={18} />
              <ChevronsRight size={13} />
            </span>
          </div>
        </div>
        <div className="taskMeta">
          {info && (
            <span className="badge" style={{ color: TONE_COLOR[info.tone] }}>
              {info.tone === "neutral" ? (
                <CalendarDays size={12} style={{ marginRight: 4, verticalAlign: -2 }} />
              ) : (
                <span className="dueCircle" style={{ background: TONE_COLOR[info.tone] }} />
              )}
              {info.label}
            </span>
          )}
          {task.repeat && task.repeat.freq !== "none" && (
            <span className="badge" style={{ color: "var(--ink-soft)" }}>
              <Repeat size={12} style={{ marginRight: 4, verticalAlign: -2 }} />
              {describeRepeat(task.repeat, task.deadline)}
            </span>
          )}
          {task.notes && (
            <span className="badge noteBadge" style={{ color: "var(--ink-soft)" }}>
              <StickyNote size={12} style={{ marginRight: 4, verticalAlign: -2, flexShrink: 0 }} />
              <span className="noteExcerpt">{task.notes.trim()}</span>
            </span>
          )}
        </div>
      </div>
      <div className="swipeHint" style={{ opacity: Math.min(Math.max(dx, 0) / 90, 1) }}>
        <Check size={16} />
      </div>
      <div className="swipeHintLeft" style={{ opacity: Math.min(Math.max(-dx, 0) / 90, 1) }}>
        <SkipForward size={16} />
      </div>
      {completing && (
        <div className="completeOverlay">
          <Check size={26} />
          <span className="overlayLabel">Done</span>
        </div>
      )}
      {skipping && (
        <div className="skipOverlay">
          <SkipForward size={22} />
          <span className="overlayLabel">Skipped</span>
        </div>
      )}
    </div>
  );
}

function RepeatEditor({ value, onChange, deadline }) {
  const rep = value || noRepeat();
  const [intervalText, setIntervalText] = useState(String(rep.interval));
  const [countText, setCountText] = useState(String(rep.endCount || 5));

  useEffect(() => { setIntervalText(String(rep.interval)); }, [rep.interval]);
  useEffect(() => { setCountText(String(rep.endCount || 5)); }, [rep.endCount]);

  const setFreq = (freq) => {
    if (freq === "none") { onChange(noRepeat()); return; }
    onChange({ ...noRepeat(), ...rep, freq, byDay: freq === "week" ? rep.byDay : [] });
  };
  const handleIntervalChange = (raw) => {
    setIntervalText(raw);
    const n = Number(raw);
    if (raw !== "" && Number.isFinite(n) && n >= 1) onChange({ ...rep, interval: Math.floor(n) });
  };
  const handleIntervalBlur = () => {
    const n = Number(intervalText);
    if (!intervalText || !Number.isFinite(n) || n < 1) setIntervalText(String(rep.interval));
  };
  const toggleDay = (code) => {
    const has = rep.byDay.includes(code);
    onChange({ ...rep, byDay: has ? rep.byDay.filter((c) => c !== code) : [...rep.byDay, code] });
  };
  const setEndType = (endType) => onChange({ ...rep, endType, endCount: endType === "count" ? (rep.endCount || 5) : rep.endCount });
  const handleCountChange = (raw) => {
    setCountText(raw);
    const n = Number(raw);
    if (raw !== "" && Number.isFinite(n) && n >= 1) onChange({ ...rep, endCount: Math.floor(n) });
  };
  const handleCountBlur = () => {
    const n = Number(countText);
    if (!countText || !Number.isFinite(n) || n < 1) setCountText(String(rep.endCount || 5));
  };

  const unitWord = { day: "day", week: "week", month: "month", year: "year" }[rep.freq] || "week";
  const preview = describeRepeat(rep, deadline);
  const needsDeadlineHint = (rep.freq === "month" || rep.freq === "year") && !deadline;

  return (
    <div>
      <select className="select" value={rep.freq} onChange={(e) => setFreq(e.target.value)}>
        <option value="none">Doesn't repeat</option>
        <option value="day">Every day</option>
        <option value="week">Every week</option>
        <option value="month">Every month</option>
        <option value="year">Every year</option>
      </select>

      {rep.freq !== "none" && (
        <div className="repeatAdvanced">
          <div className="repeatIntervalRow">
            <span>Every</span>
            <input
              className="textInput repeatIntervalInput"
              type="number"
              min="1"
              value={intervalText}
              onChange={(e) => handleIntervalChange(e.target.value)}
              onBlur={handleIntervalBlur}
            />
            <span>{unitWord}{rep.interval > 1 ? "s" : ""}</span>
          </div>

          {rep.freq === "week" && (
            <div className="repeatWeekdayBlock">

                  <button

                    className={"weekdayChip" + (rep.byDay.includes(code) ? " weekdayChipActive" : "")}

              type="number"
              min="1"

              disabled={rep.endType !== "count"}

            />

      )}

  );
}

function CategoryPicker({ categories, initialCategoryId, onChange, allowUncategorized }) {
  const topLevelCategories = categories.filter((c) => !c.parentId);
  const initialCat = initialCategoryId ? categories.find((c) => c.id === initialCategoryId) : null;
  const initialIsUncategorized = allowUncategorized && !initialCategoryId;
  const initialTopId = initialCat ? (initialCat.parentId || initialCat.id) : (topLevelCategories[0]?.id ?? "");

  const [topCategoryId, setTopCategoryId] = useState(initialIsUncategorized ? "__uncategorized__" : initialTopId);
  const [creatingCat, setCreatingCat] = useState(categories.length === 0);
  const [newCatName, setNewCatName] = useState("");
  const [newCatColor, setNewCatColor] = useState(PALETTE_KEYS[0]);

  const isUncategorizedSelected = allowUncategorized && topCategoryId === "__uncategorized__";
  const children = isUncategorizedSelected ? [] : categories.filter((c) => c.parentId === topCategoryId);
  const initialSubId = initialCat && initialCat.parentId ? initialCat.id : (children[0]?.id ?? "");
  const [subCategoryId, setSubCategoryId] = useState(initialSubId);
  const [creatingSub, setCreatingSub] = useState(false);
  const [newSubName, setNewSubName] = useState("");
  const [newSubColor, setNewSubColor] = useState(PALETTE_KEYS[0]);

  const finalCategoryId = children.length > 0 ? subCategoryId : topCategoryId;

  useEffect(() => {
    if (isUncategorizedSelected) {
      onChange({ categoryId: null, newCategoryName: null, newCategoryColor: null, newCategoryParentId: null, isValid: true });
      return;
    }
    onChange({
      categoryId: (creatingCat || creatingSub) ? null : finalCategoryId,
      newCategoryName: creatingCat ? newCatName.trim() : (creatingSub ? newSubName.trim() : null),
      newCategoryColor: creatingCat ? newCatColor : (creatingSub ? newSubColor : null),
      newCategoryParentId: creatingSub ? topCategoryId : null,
      isValid: creatingCat ? !!newCatName.trim() : (creatingSub ? !!newSubName.trim() : (children.length === 0 || !!subCategoryId)),
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [topCategoryId, subCategoryId, creatingCat, newCatName, newCatColor, creatingSub, newSubName, newSubColor]);

  const handleTopChange = (id) => {
    setTopCategoryId(id);
    if (id === "__uncategorized__") { setCreatingSub(false); setSubCategoryId(""); return; }
    const kids = categories.filter((c) => c.parentId === id);
    setSubCategoryId(kids[0]?.id ?? "");
    setCreatingSub(false);
    setNewSubName("");
  };

  return (
    <div>
      {!creatingCat ? (
        <div>
          <div className="catPicker">
            <select className="select" value={topCategoryId} onChange={(e) => handleTopChange(e.target.value)}>
              {allowUncategorized && <option value="__uncategorized__">Unassigned</option>}
              {topLevelCategories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <button className="miniLink" onClick={() => setCreatingCat(true)}>+ new class subject</button>
          </div>
          {!isUncategorizedSelected && children.length > 0 && (
            <>
              <label className="fieldLabel" style={{ margin: "10px 0 4px" }}>Subcategory</label>
              {!creatingSub ? (
                <div className="catPicker">
                  <select
                    className="select"
                    value={subCategoryId}
                    onChange={(e) => {
                      if (e.target.value === "__new__") { setCreatingSub(true); setNewSubColor(topLevelCategories.find((c) => c.id === topCategoryId)?.color || PALETTE_KEYS[0]); }
                      else setSubCategoryId(e.target.value);
                    }}
                  >
                    {children.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                    <option value="__new__">+ New subcategory…</option>
                  </select>
                </div>
              ) : (
                <div>
                  <input className="textInput" placeholder="e.g. Chemistry" value={newSubName} onChange={(e) => setNewSubName(e.target.value)} />
                  <div className="swatchRow">
                    {PALETTE_KEYS.map((k) => (
                      <button
                        key={k}
                        className={"swatch" + (newSubColor === k ? " swatchActive" : "")}
                        style={{ background: PALETTE[k].solid }}
                        onClick={() => setNewSubColor(k)}
                        aria-label={k}
                      />
                    ))}
                  </div>
                  <button className="miniLink" onClick={() => { setCreatingSub(false); setNewSubName(""); }}>use an existing subcategory</button>
                </div>
              )}
            </>
          )}
        </div>
      ) : (
        <div>
          <input className="textInput" placeholder="e.g. Chemistry" value={newCatName} onChange={(e) => setNewCatName(e.target.value)} />
          <div className="swatchRow">
            {PALETTE_KEYS.map((k) => (
              <button
                key={k}
                className={"swatch" + (newCatColor === k ? " swatchActive" : "")}
                style={{ background: PALETTE[k].solid }}
                onClick={() => setNewCatColor(k)}
                aria-label={k}
              />
            ))}
          </div>
          {categories.length > 0 && <button className="miniLink" onClick={() => setCreatingCat(false)}>use an existing class subject</button>}
        </div>
      )}
    </div>
  );
}

function TaskModal({ categories, initialCategoryId, onClose, onSubmit }) {
  const [title, setTitle] = useState("");
  const [deadline, setDeadline] = useState("");
  const [repeat, setRepeat] = useState(noRepeat());
  const [notes, setNotes] = useState("");
  const [error, setError] = useState("");
  const [categoryChoice, setCategoryChoice] = useState(null);

  const submit = () => {
    if (!title.trim()) { setError("Give the assignment a title."); return; }
    if (categoryChoice && !categoryChoice.isValid) {
      setError(categoryChoice.newCategoryName !== null ? "Name the new class subject." : "Pick a subcategory.");
      return;
    }
    let finalDeadline = deadline || null;
    if (!finalDeadline) finalDeadline = initialDeadlineForRepeat(repeat);
    onSubmit({
      categoryId: categoryChoice?.categoryId ?? null,
      newCategoryName: categoryChoice?.newCategoryName ?? null,
      newCategoryColor: categoryChoice?.newCategoryColor ?? null,
      newCategoryParentId: categoryChoice?.newCategoryParentId ?? null,
      title: title.trim(),
      deadline: finalDeadline,
      repeat,
      notes: notes.trim(),
    });
  };

  return (
    <Sheet title="Add an assignment" onClose={onClose}>
      <label className="fieldLabel">Assignment title</label>
      <input className="textInput" placeholder="e.g. Finish problem set 4" value={title} onChange={(e) => setTitle(e.target.value)} />

      <label className="fieldLabel">Class Subject</label>
      <CategoryPicker categories={categories} initialCategoryId={initialCategoryId} onChange={setCategoryChoice} />

      <label className="fieldLabel">Deadline (optional)</label>
      <input className="textInput" type="date" value={deadline} onChange={(e) => setDeadline(e.target.value)} />

      <label className="fieldLabel">Repeat</label>
      <RepeatEditor value={repeat} onChange={setRepeat} deadline={deadline} />

      <label className="fieldLabel">Notes (optional)</label>
      <textarea className="textArea" placeholder="Anything worth remembering about this assignment" value={notes} onChange={(e) => setNotes(e.target.value)} />

      {error && <p className="errorText">{error}</p>}
      <button className="primaryBtn" onClick={submit}>Add assignment</button>
    </Sheet>
  );
}

function AllTasksCategoryRows({ leaf, tasks, draggingId, onStartDrag, onOpenTask, registerRowDropZone }) {
  const itemRefs = useRef({});
  const prevTopsRef = useRef({});
  const orderKey = leaf.queue.join(",");

  useLayoutEffect(() => {
    const newTops = {};
    leaf.queue.forEach((tid) => {
      const el = itemRefs.current[tid];
      if (el) newTops[tid] = el.getBoundingClientRect().top;
    });
    leaf.queue.forEach((tid) => {
      if (tid === draggingId) return;
      const el = itemRefs.current[tid];
      if (!el) return;
      const prevTop = prevTopsRef.current[tid];
      const newTop = newTops[tid];
      if (prevTop != null && newTop != null && prevTop !== newTop) {
        const deltaY = prevTop - newTop;
        el.style.transition = "none";
        el.style.transform = `translateY(${deltaY}px)`;
        requestAnimationFrame(() => {
          el.style.transition = "transform 0.22s ease";
          el.style.transform = "";
        });
      }
    });
    prevTopsRef.current = newTops;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [orderKey, draggingId]);

  if (leaf.queue.length === 0) return <p className="emptyBody">Nothing queued.</p>;

  return (
    <>
      {leaf.queue.map((tid, idx) => {
        const t = tasks[tid];
        if (!t) return null;
        const info = deadlineInfo(t.deadline);
        return (
          <div
            key={tid}
            ref={(el) => {
              itemRefs.current[tid] = el;
              registerRowDropZone?.(tid, el);
            }}
            className={"catListRow draggableTaskRow" + (draggingId === tid ? " rowArmed" : "")}
            onPointerDown={(e) => { onStartDrag(t, e.clientX, e.clientY, { fromCategoryId: leaf.id, onTap: () => onOpenTask(t) }); }}
          >
            <GripVertical size={13} color="var(--ink-soft)" />
            <span className="queueIdx">{idx + 1}</span>
            <span className="catName" style={{ fontWeight: idx === 0 ? 600 : 400 }}>{t.title}</span>
            {info && <span className="badge" style={{ color: idx === 0 ? TONE_COLOR[info.tone] : "var(--ink-soft)" }}>{info.label}</span>}
          </div>
        );
      })}
    </>
  );
}

function CompletedHistoryModal({ log, initialFilter, onBack, onReadd, categories, retentionDays, onUpdateRetention }) {
  const [filter, setFilter] = useState(initialFilter || "today");
  const [addedIds, setAddedIds] = useState(() => new Set());
  const now = Date.now();
  const filtered = log
    .filter((e) => {
      if (filter === "today") return new Date(e.completedAt).toDateString() === new Date().toDateString();
      if (filter === "week") return now - e.completedAt <= 7 * 86400000;
      if (filter === "month") return now - e.completedAt <= 30 * 86400000;
      return true;
    })
    .sort((a, b) => b.completedAt - a.completedAt);

  const handleReadd = (entry) => {
    onReadd(entry);
    setAddedIds((prev) => new Set(prev).add(entry.id));
  };

  return (
    <Page title="Completed assignments" onBack={onBack}>
      <div className="filterRow">
        <button className={"filterBtn" + (filter === "today" ? " filterBtnActive" : "")} onClick={() => setFilter("today")}>Today</button>
        <button className={"filterBtn" + (filter === "week" ? " filterBtnActive" : "")} onClick={() => setFilter("week")}>This week</button>
        <button className={"filterBtn" + (filter === "month" ? " filterBtnActive" : "")} onClick={() => setFilter("month")}>This month</button>
        <button className={"filterBtn" + (filter === "all" ? " filterBtnActive" : "")} onClick={() => setFilter("all")}>All</button>
      </div>
      <div className="retentionRow">
        <span>Auto-delete history after</span>
        <select className="select retentionSelect" value={retentionDays || 0} onChange={(e) => onUpdateRetention(Number(e.target.value) || null)}>
          <option value={30}>30 days</option>
          <option value={60}>60 days</option>
          <option value={90}>90 days</option>
          <option value={180}>6 months</option>
          <option value={365}>1 year</option>
          <option value={0}>Never</option>
        </select>
      </div>
      {filtered.length === 0 && <p className="emptyBody">Nothing completed in this range yet.</p>}
      <div className="queueList">
        {filtered.map((e) => {
          const col = PALETTE[e.categoryColor] || PALETTE.teal;
          const d = new Date(e.completedAt);
          const timeLabel = d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
