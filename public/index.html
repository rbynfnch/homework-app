function DraggableRowList({ items, onReorder, renderRow }) {
  const [order, setOrder] = useState(items.map((it) => it.id));
  const [dragId, setDragId] = useState(null);
  const [dragOffset, setDragOffset] = useState(0);
  const dragInfo = useRef(null);
  const itemRefs = useRef({});
  const prevTopsRef = useRef({});

  useEffect(() => {
    setOrder((prev) => {
      const incoming = items.map((it) => it.id);
      const same = prev.length === incoming.length && prev.every((id, i) => id === incoming[i]);
      return same ? prev : incoming;
    });
  }, [items]);

  useLayoutEffect(() => {
    const newTops = {};
    order.forEach((id) => {
      const el = itemRefs.current[id];
      if (el) newTops[id] = el.getBoundingClientRect().top;
    });
    order.forEach((id) => {
      if (id === dragId) return;
      const el = itemRefs.current[id];
      if (!el) return;
      const prevTop = prevTopsRef.current[id];
      const newTop = newTops[id];
      if (prevTop != null && newTop != null && prevTop !== newTop) {
        const deltaY = prevTop - newTop;
        el.style.transition = "none";
        el.style.transform = `translateY(${deltaY}px)`;
        requestAnimationFrame(() => {
          el.style.transition = "transform 0.22s ease";
          el.style.transform = "";
        });
      }
    });
    prevTopsRef.current = newTops;
  }, [order, dragId]);

  const byId = Object.fromEntries(items.map((it) => [it.id, it]));

  const onHandleDown = (id, clientY) => {
    const idx = order.indexOf(id);
    const el = itemRefs.current[id];
    const step = (el?.offsetHeight || 38) + 4;
    dragInfo.current = { id, startY: clientY, startIndex: idx, step, order: [...order] };
    setDragId(id);
    setDragOffset(0);
  };

  const onMove = (clientY) => {
    const info = dragInfo.current;
    if (!info) return;
    const delta = clientY - info.startY;
    const rawShift = Math.round(delta / info.step);
    const targetIndex = Math.min(Math.max(info.startIndex + rawShift, 0), info.order.length - 1);
    const actualShift = targetIndex - info.startIndex;
    setDragOffset(delta - actualShift * info.step);
    const without = info.order.filter((id) => id !== info.id);
    without.splice(targetIndex, 0, info.id);
    setOrder((prev) => {
      const same = prev.length === without.length && prev.every((id, i) => id === without[i]);
      return same ? prev : without;
    });
  };

  const endDrag = () => {
    if (dragInfo.current) {
      const changed = order.length !== dragInfo.current.order.length || order.some((id, i) => id !== dragInfo.current.order[i]);
      if (changed) onReorder(order);
    }
    dragInfo.current = null;
    setDragId(null);
    setDragOffset(0);
  };

  return (
    <div className="dragRowList">
      {order.map((id, idx) => {
        const item = byId[id];
        if (!item) return null;
        const dragging = dragId === id;
        return (
          <div
            key={id}
            ref={(el) => (itemRefs.current[id] = el)}
            className={"dragRow" + (dragging ? " dragRowActive" : "")}
            style={dragging ? { transform: `translateY(${dragOffset}px)`, zIndex: 30 } : undefined}
          >
            <button
              className="dragRowHandle"
              aria-label="Reorder"
              onMouseDown={(e) => onHandleDown(id, e.clientY)}
              onMouseMove={(e) => dragId === id && onMove(e.clientY)}
              onMouseUp={endDrag}
              onMouseLeave={() => dragId === id && endDrag()}
              onTouchStart={(e) => onHandleDown(id, e.touches[0].clientY)}
              onTouchMove={(e) => { if (dragId === id) onMove(e.touches[0].clientY); }}
              onTouchEnd={endDrag}
            >
              <GripVertical size={13} />
            </button>
            <div className="dragRowContent">{renderRow(item, idx, order.length)}</div>
          </div>
        );
      })}
    </div>
  );
}

function LongPressRowList({ items, onReorder, renderRow, onTapItem }) {
  const [order, setOrder] = useState(items.map((it) => it.id));
  const [dragId, setDragId] = useState(null);
  const [dragOffset, setDragOffset] = useState(0);
  const dragInfo = useRef(null);
  const pendingRef = useRef(null);
  const pressTimerRef = useRef(null);
  const itemRefs = useRef({});
  const prevTopsRef = useRef({});

  useEffect(() => {
    setOrder((prev) => {
      const incoming = items.map((it) => it.id);
      const same = prev.length === incoming.length && prev.every((id, i) => id === incoming[i]);
      return same ? prev : incoming;
    });
  }, [items]);

  useLayoutEffect(() => {
    const newTops = {};
    order.forEach((id) => {
      const el = itemRefs.current[id];
      if (el) newTops[id] = el.getBoundingClientRect().top;
    });
    order.forEach((id) => {
      if (id === dragId) return;
      const el = itemRefs.current[id];
      if (!el) return;
      const prevTop = prevTopsRef.current[id];
      const newTop = newTops[id];
      if (prevTop != null && newTop != null && prevTop !== newTop) {
        const deltaY = prevTop - newTop;
        el.style.transition = "none";
        el.style.transform = `translateY(${deltaY}px)`;
        requestAnimationFrame(() => {
          el.style.transition = "transform 0.22s ease";
          el.style.transform = "";
        });
      }
    });
    prevTopsRef.current = newTops;
  }, [order, dragId]);

  const byId = Object.fromEntries(items.map((it) => [it.id, it]));

  const clearPending = () => {
    if (pressTimerRef.current) { clearTimeout(pressTimerRef.current); pressTimerRef.current = null; }
    pendingRef.current = null;
  };

  const armDrag = (id) => {
    const p = pendingRef.current;
    if (!p) return;
    const idx = order.indexOf(id);
    const el = itemRefs.current[id];
    const step = (el?.offsetHeight || 38) + 4;
    dragInfo.current = { id, startY: p.startY, startIndex: idx, step, order: [...order] };
    if (navigator.vibrate) navigator.vibrate(12);
    pendingRef.current = null;
    setDragId(id);
    setDragOffset(0);
  };

  const onRowDown = (id, clientX, clientY, e) => {
    if (e && e.target && e.target.closest && e.target.closest(".tinyIcon")) return;
    clearPending();
    pendingRef.current = { id, startX: clientX, startY: clientY };
    pressTimerRef.current = setTimeout(() => armDrag(id), LONG_PRESS_MS);
  };

  const onPreArmMove = (id, clientX, clientY) => {
    const p = pendingRef.current;
    if (!p || p.id !== id) return;
    const dist = Math.hypot(clientX - p.startX, clientY - p.startY);
    if (dist > PRESS_CANCEL_PX) clearPending();
  };

  const onMove = (clientY) => {
    const info = dragInfo.current;
    if (!info) return;
    const delta = clientY - info.startY;
    const rawShift = Math.round(delta / info.step);
    const targetIndex = Math.min(Math.max(info.startIndex + rawShift, 0), info.order.length - 1);
    const actualShift = targetIndex - info.startIndex;
    setDragOffset(delta - actualShift * info.step);
    const without = info.order.filter((id) => id !== info.id);
    without.splice(targetIndex, 0, info.id);
    setOrder((prev) => {
      const same = prev.length === without.length && prev.every((id, i) => id === without[i]);
      return same ? prev : without;
    });
  };

  const endDrag = (id) => {
    const wasPending = !!pressTimerRef.current && pendingRef.current?.id === id;
    clearPending();
    if (dragInfo.current) {
      const changed = order.length !== dragInfo.current.order.length || order.some((idx2, i) => idx2 !== dragInfo.current.order[i]);
      if (changed) onReorder(order);
      dragInfo.current = null;
      setDragId(null);
      setDragOffset(0);
    } else if (wasPending) {
      const item = byId[id];
      if (item) onTapItem?.(item);
    }
  };

  return (
    <div className="dragRowList">
      {order.map((id, idx) => {
        const item = byId[id];
        if (!item) return null;
        const armed = dragId === id;
        const handlers = {
          onMouseDown: (e) => onRowDown(id, e.clientX, e.clientY, e),
          onMouseMove: (e) => { if (dragId === id) onMove(e.clientY); else onPreArmMove(id, e.clientX, e.clientY); },
          onMouseUp: () => endDrag(id),
          onMouseLeave: () => { if (dragId === id) endDrag(id); else clearPending(); },
          onTouchStart: (e) => onRowDown(id, e.touches[0].clientX, e.touches[0].clientY, e),
          onTouchMove: (e) => { if (dragId === id) onMove(e.touches[0].clientY); else onPreArmMove(id, e.touches[0].clientX, e.touches[0].clientY); },
          onTouchEnd: () => endDrag(id),
        };
        return (
          <div
            key={id}
            ref={(el) => (itemRefs.current[id] = el)}
            className={"dragRow longPressRow" + (armed ? " dragRowActive rowArmed" : "")}
            style={armed ? { transform: `translateY(${dragOffset}px)`, zIndex: 30 } : undefined}
            {...handlers}
          >
            <div className="dragRowContent">{renderRow(item, idx, order.length)}</div>
          </div>
        );
      })}
    </div>
  );
}

function ManageCategoryModal({ category, allCategories, tasks, onBack, onDeleteCategory, onRequestDeleteTask, onReorderTasks, onReorderSubcategories, onAddTask, onOpenTask, onAddOrConvertSubcategory, onOpenChildCategory, onUpdateCategory }) {
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [editing, setEditing] = useState(false);
  const [editName, setEditName] = useState(category.name);
  const [editColor, setEditColor] = useState(category.color);
  const [newSubName, setNewSubName] = useState("");
  const [newSubColor, setNewSubColor] = useState(category.color);
  const c = PALETTE[category.color] || PALETTE.teal;

  const children = allCategories.filter((cc) => cc.parentId === category.id);
  const isTopLevel = !category.parentId;
  const hasChildren = children.length > 0;
  const totalChildTasks = children.reduce((sum, ch) => sum + ch.queue.length, 0);

  const saveEdit = () => {
    if (!editName.trim()) return;
    onUpdateCategory(category.id, { name: editName.trim(), color: editColor });
    setEditing(false);
  };

  const deleteWarning = hasChildren
    ? `This will also permanently delete ${children.length} subcategor${children.length === 1 ? "y" : "ies"} and ${totalChildTasks} assignment${totalChildTasks === 1 ? "" : "s"} inside "${category.name}". This can't be undone.`
    : `This will also permanently delete ${category.queue.length} assignment${category.queue.length === 1 ? "" : "s"} in "${category.name}". This can't be undone.`;

  return (
    <Page
      title={category.name}
      onBack={onBack}
      afterTitle={
        <button className="titleEditBtn" onClick={() => setEditing(true)} aria-label="Edit class subject">
          <Pencil size={15} />
        </button>
      }
    >
      {editing ? (
        <div className="newCatRow">
          <label className="fieldLabel" style={{ margin: "0 0 6px" }}>{isTopLevel ? "Class Subject" : "Subcategory"} name</label>
          <input className="textInput" value={editName} onChange={(e) => setEditName(e.target.value)} />
          <div className="swatchRow">
            {PALETTE_KEYS.map((k) => (
              <button key={k} className={"swatch" + (editColor === k ? " swatchActive" : "")} style={{ background: PALETTE[k].solid }} onClick={() => setEditColor(k)} aria-label={k} />
            ))}
          </div>
          <div className="backupRow" style={{ marginTop: 10 }}>
            <button className="primaryBtn" style={{ marginTop: 0, flex: 1 }} onClick={saveEdit}>Save</button>
            <button className="ghostBtn" style={{ marginTop: 0, flex: 1 }} onClick={() => { setEditing(false); setEditName(category.name); setEditColor(category.color); setConfirmDelete(false); }}>Cancel</button>
          </div>
          {confirmDelete ? (
            <div style={{ marginTop: 16 }}>
              <p className="emptyBody" style={{ marginBottom: 8 }}>{deleteWarning}</p>
              <div className="deleteRow">
                <button className="dangerLink" onClick={() => onDeleteCategory(category.id)}>Confirm delete {isTopLevel ? "class subject" : "subcategory"}</button>
              </div>
            </div>
          ) : (
            <div className="deleteRow" style={{ marginTop: 16 }}>
              <button className="dangerLink" onClick={() => setConfirmDelete(true)}>
                <Trash2 size={14} /> Delete {isTopLevel ? "class subject" : "subcategory"}
              </button>
            </div>
          )}
        </div>
      ) : (
        <div className="manageCatHead">
          <span className="dot" style={{ background: c.solid }} />
          <span className="catCount">
            {hasChildren
              ? `${children.length} subcategor${children.length === 1 ? "y" : "ies"}`
              : `${category.queue.length} assignment${category.queue.length === 1 ? "" : "s"} in queue`}
          </span>
          <div style={{ flex: 1 }} />
          {!hasChildren && (
            <button className="miniFab" onClick={onAddTask} aria-label="Add assignment">
              <Plus size={16} />
            </button>
          )}
        </div>
      )}

      {isTopLevel && (
        <div className="newCatRow">
          <label className="fieldLabel" style={{ margin: "0 0 6px" }}>
            {hasChildren ? "Add another subcategory" : "Add a subcategory"}
          </label>
          <input className="textInput" placeholder="e.g. Algebra II" value={newSubName} onChange={(e) => setNewSubName(e.target.value)} />
          <div className="swatchRow">
            {PALETTE_KEYS.map((k) => (
              <button key={k} className={"swatch" + (newSubColor === k ? " swatchActive" : "")} style={{ background: PALETTE[k].solid }} onClick={() => setNewSubColor(k)} aria-label={k} />
            ))}
          </div>
          {!hasChildren && category.queue.length > 0 && (
            <p className="sheetHint" style={{ margin: "8px 0 0" }}>
              {category.queue.length} existing assignment{category.queue.length === 1 ? "" : "s"} will move into this subcategory.
            </p>
          )}
          <button
            className="ghostBtn"
            onClick={() => { if (newSubName.trim()) { onAddOrConvertSubcategory(category.id, newSubName.trim(), newSubColor); setNewSubName(""); } }}
          >
            {hasChildren ? "Add subcategory" : "Create subcategory"}
          </button>
        </div>
      )}

      {hasChildren ? (
        <DraggableRowList
          items={children.map((ch) => ({ id: ch.id, child: ch }))}
          onReorder={(newOrderIds) => onReorderSubcategories(category.id, newOrderIds)}
          renderRow={(item) => {
            const child = item.child;
            const col = PALETTE[child.color] || PALETTE.teal;
            return (
              <div className="queueRow">
                <span className="dot" style={{ background: col.solid, marginLeft: 2 }} />
                <button className="queueTitle queueTitleBtn" onClick={() => onOpenChildCategory(child.id)}>{child.name}</button>
                <span className="catCount">{child.queue.length}</span>
              </div>
            );
          }}
        />
      ) : (
        <>
          {category.queue.length === 0 && <p className="emptyBody">No assignments in this queue yet.</p>}
          {category.queue.length > 0 && (
            <LongPressRowList
              items={category.queue.map((tid) => ({ id: tid, taskId: tid }))}
              onReorder={(newOrderIds) => onReorderTasks(category.id, newOrderIds)}
              onTapItem={(item) => { const t = tasks[item.taskId]; if (t) onOpenTask(t); }}
              renderRow={(item, idx) => {

                if (!t) return null;

                  <div className={"queueRow" + (idx === 0 ? " queueRowFront" : "")}>
                    <span className="queueIdx">{idx + 1}</span>

                      <button className="tinyIcon" onClick={() => onRequestDeleteTask(t)} aria-label="Delete assignment"><Trash2 size={13} /></button>
                    </div>
                  </div>
                );
              }}
            />
          )}
        </>
      )}
    </Page>
  );
}

  --ink: #F4F7EA;
  --ink-soft: #98A187;
  --line: #262B1D;
  --accent: #C6FF00;
  --accent-ink: #0B0F06;
  --accent-soft: #242F0A;
  --accent-text: #C6FF00;
  --danger: #FF5C5C;
  --warn: #FFC24D;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background: var(--paper);
  max-width: 400px;
  margin: 0 auto;
  border-radius: 28px;
  padding: 20px 18px 90px;
  position: relative;
  min-height: 520px;
  box-sizing: border-box;
  overflow: hidden;
}
.shellContent { position: relative; z-index: 1; }
.header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
.brand { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; margin: 0; letter-spacing: 0.02em; color: var(--accent-text); }
.brandLogoBadge { display: inline-block; background: #0A0B07; border-radius: 8px; padding: 6px 10px; line-height: 0; }
.brandLogo { height: 22px; width: auto; display: block; }
.brandTagline { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin: 2px 0 0; }
.date { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin: 3px 0 0; text-transform: uppercase; letter-spacing: 0.04em; }
.headerActions { display: flex; align-items: center; gap: 8px; }
.iconBtn { width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
.iconBtn:hover { border-color: var(--accent-text); color: var(--accent-text); }
.greetingBanner { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); color: var(--accent-text); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 500; margin-bottom: 16px; }
.greetingClose { margin-left: auto; background: none; border: none; color: var(--accent-text); cursor: pointer; display: flex; flex-shrink: 0; }
.progressWrap { margin: 0 0 18px; }
.progressBar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progressFill { height: 100%; background: linear-gradient(90deg, var(--accent), #4a9d95); border-radius: 999px; transition: width 0.35s ease; }
.progressLabel { display: block; margin-top: 6px; font-size: 11.5px; color: var(--ink-soft); font-family: 'IBM Plex Mono', monospace; }

.stack { display: flex; flex-direction: column; gap: 22px; }
.dragItem { display: flex; align-items: flex-start; gap: 4px; position: relative; transition: transform 0.18s ease; }
.dragItemActive { transition: none; }
.dragItemActive .catBlock, .dragItemActive .groupBlock { box-shadow: 0 10px 22px rgba(33,32,28,0.16); border-radius: 16px; }
.dragHandle { flex-shrink: 0; width: 22px; height: 22px; margin-top: 24px; border: none; background: transparent; color: var(--ink-soft); cursor: grab; display: flex; align-items: center; justify-content: center; touch-action: none; }
.dragHandle:active { cursor: grabbing; color: var(--ink); }
.dragContent { flex: 1; min-width: 0; }
.dropTargetActive { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 16px; }
.catBlock { display: flex; flex-direction: column; gap: 8px; }
.groupBlock { display: flex; flex-direction: column; gap: 8px; }
.groupHeader { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft); }
.groupNameBtn { font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
.groupNameBtn:hover { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
.groupChildren { display: flex; flex-direction: column; gap: 16px; padding-left: 14px; border-left: 2px solid var(--line); }
.catLabel { display: flex; align-items: center; gap: 7px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.catName { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; }
.catNameBtn { font-size: 13px; font-weight: 600; letter-spacing: 0.01em; background: none; border: none; padding: 0; color: var(--ink); cursor: pointer; font-family: 'Inter', sans-serif; }
.catNameBtn:hover { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
.catCount { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-left: auto; }
.cardWrap { position: relative; }
.peek { position: absolute; left: 0; right: 0; height: 100%; border-radius: 16px; z-index: 0; }
.peek1 { transform: translateY(10px) scale(0.96) rotate(1.4deg); opacity: 0.55; }
.peek2 { transform: translateY(6px) scale(0.98) rotate(-1deg); opacity: 0.8; }
.taskCard { position: relative; z-index: 1; background: var(--card); border-radius: 16px; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: stretch; cursor: grab; user-select: none; touch-action: none; animation: cardEnter 0.3s ease; }
.taskCardArmed { cursor: grabbing; touch-action: none; }
.taskCardBar { width: 5px; flex-shrink: 0; }
.taskCardBody { padding: 15px 14px; flex: 1; min-width: 0; }
.taskTitleRow { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.taskTitle { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.35; flex: 1; min-width: 0; }
.swipeHintIcons { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-top: 1px; }
.swipeHintIconGroup { display: flex; align-items: center; gap: 1px; color: var(--ink-soft); opacity: 0.55; }
.taskMeta { display: flex; flex-wrap: wrap; gap: 10px; max-width: 100%; }
.noteBadge { min-width: 0; max-width: 100%; }
.noteExcerpt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
.badge { font-size: 11.5px; font-family: 'IBM Plex Mono', monospace; display: inline-flex; align-items: center; }
.dueCircle { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
.swipeHint { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--accent-text); pointer-events: none; }
.swipeHintLeft { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.completeOverlay, .skipOverlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 16px; z-index: 2; animation: overlayPop 0.28s cubic-bezier(.34,1.56,.64,1); gap: 4px; }
.completeOverlay { background: linear-gradient(135deg, #C6FF00, #9FE000); color: #0B0F06; }
.skipOverlay { background: linear-gradient(135deg, #2A2E22, #3D4330); color: #fff; }
.overlayLabel { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
@keyframes overlayPop { 0% { opacity: 0; transform: scale(0.85); } 60% { opacity: 1; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
@keyframes cardEnter { 0% { opacity: 0; transform: translateY(10px) scale(0.97); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
.caughtUp { display: flex; align-items: center; gap: 8px; padding: 14px; border-radius: 16px; border: 1px dashed; font-size: 13.5px; color: var(--ink-soft); background: var(--card); }
.miniLink { background: none; border: none; font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 0; margin-left: auto; }
.miniFab { width: 32px; height: 32px; border-radius: 50%; background: #15170F; color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: auto; flex-shrink: 0; box-shadow: 0 3px 8px rgba(0,0,0,0.35); }
.miniFab:hover { filter: brightness(1.3); }
.fabRow { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; z-index: 20; }
.fab { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 1px rgba(198,255,0,0.35), 0 6px 22px rgba(198,255,0,0.35); }
.fabSecondary { width: 54px; height: 54px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 18px rgba(33,32,28,0.28); }
.fabSecondary:hover { color: var(--accent-text); border-color: var(--accent-text); }
.dragGhost { position: fixed; transform: translate(-50%, -120%); background: #15170F; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; pointer-events: none; z-index: 60; box-shadow: 0 6px 16px rgba(0,0,0,0.4); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.undoBar { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: #15170F; color: #fff; font-size: 12.5px; font-weight: 500; padding: 8px 8px 8px 16px; border-radius: 999px; z-index: 40; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
.undoBtn { background: rgba(255,255,255,0.16); border: none; color: #fff; font-weight: 600; font-size: 12px; padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.undoBtn:hover { background: rgba(255,255,255,0.26); }
.celebrationToast { position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-size: 12.5px; font-weight: 700; padding: 9px 16px; border-radius: 999px; z-index: 45; display: flex; align-items: center; gap: 8px; box-shadow: 0 0 0 1px rgba(198,255,0,0.3), 0 6px 18px rgba(198,255,0,0.3); animation: overlayPop 0.32s cubic-bezier(.34,1.56,.64,1); pointer-events: none; white-space: nowrap; }
.celebrationBackdrop { position: fixed; inset: 0; background: rgba(33,32,28,0.55); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.celebrationCard { position: relative; overflow: hidden; background: var(--card); border-radius: 24px; padding: 36px 26px 26px; max-width: 320px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(33,32,28,0.35); animation: overlayPop 0.4s cubic-bezier(.34,1.56,.64,1); }
.celebrationEmoji { font-size: 46px; line-height: 1; margin-bottom: 10px; }
.celebrationTitle { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
.celebrationSubtitle { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 20px; }
.confettiWrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
.confettiPiece { position: absolute; top: -14px; width: 8px; height: 14px; opacity: 0.9; border-radius: 2px; animation: confettiFall 1.5s ease-in forwards; }
@keyframes confettiFall { 0% { transform: translateY(-14px) rotate(0deg); opacity: 1; } 100% { transform: translateY(260px) rotate(420deg); opacity: 0; } }
.emptyState { text-align: center; padding: 30px 14px; border: 1px dashed var(--line); border-radius: 16px; }
.emptyTitle { font-weight: 600; font-size: 15px; margin: 0 0 6px; }
.emptyBody { font-size: 13px; color: var(--ink-soft); margin: 0 0 14px; line-height: 1.5; }
.onboard { text-align: center; padding: 50px 16px; }
.onboardIcon { width: 44px; height: 44px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-text); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
.onboardTitle { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 600; margin: 0 0 12px; }
.onboardBody { font-size: 14px; color: var(--ink-soft); line-height: 1.6; max-width: 300px; margin: 0 auto 26px; }
.authWrap { text-align: center; padding: 34px 4px 10px; }

.avatarInitial { width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft, #E4F0EE); color: var(--accent, #2B6F6A); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.avatarInitialLg { width: 38px; height: 38px; font-size: 16px; flex-shrink: 0; }
.familyCodeChip { flex: 1; font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.12em; background: var(--paper, #F3F1EC); border: 1px dashed var(--line, #E4E1D6); border-radius: 12px; padding: 12px 14px; text-align: center; color: var(--ink, #21201C); }
.familyCodeReveal { text-align: left; padding: 4px 0; }
.familyCodeBig { font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 700; letter-spacing: 0.14em; text-align: center; background: var(--accent-soft, #E4F0EE); color: var(--accent, #2B6F6A); border-radius: 14px; padding: 18px 10px; margin: 0 0 16px; }
.primaryBtn { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 12px; padding: 12px 18px; font-size: 14px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 6px; letter-spacing: 0.01em; }

.ghostBtn { background: transparent; border: 1px solid var(--line, #E4E1D6); color: var(--ink, #21201C); border-radius: 12px; padding: 11px 18px; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 10px; }
.pageView { position: fixed; top: 0; bottom: 0; left: 0; right: 0; max-width: 400px; margin: 0 auto; background: var(--paper); z-index: 60; display: flex; flex-direction: column; animation: pageSlideIn 0.24s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
@keyframes pageSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
.pageHeader { display: flex; align-items: center; gap: 10px; padding: 20px 18px 14px; flex-shrink: 0; border-bottom: 1px solid var(--line); background: var(--paper); }
.pageHeaderRight { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.filterActiveBadge { position: relative; }
.filterActiveBadge::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--card); }
.filterStatusRow { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 12.5px; color: var(--ink-soft); }
.pageTitle { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 600; margin: 0; }
.titleEditBtn { background: none; border: none; padding: 4px; margin-left: 2px; color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; flex-shrink: 0; }

.overlay { position: fixed; inset: 0; background: rgba(33,32,28,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 70; }

.fieldLabel { display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft, #85837A); margin: 14px 0 6px; }
.textInput, .select, .textArea { width: 100%; box-sizing: border-box; border: 1px solid var(--line, #E4E1D6); border-radius: 10px; padding: 10px 11px; font-size: 14px; font-family: 'Inter', sans-serif; background: var(--card); color: var(--ink, #21201C); }

.repeatPreview { margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line, #E4E1D6); font-size: 12.5px; color: var(--accent, #2B6F6A); font-weight: 600; }
.repeatPreviewHint { color: var(--ink-soft, #85837A); font-weight: 500; }
.textArea { min-height: 68px; resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.catPicker { display: flex; align-items: center; gap: 10px; }

.uncatList { display: flex; flex-direction: column; gap: 6px; }
.uncatRow { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px; touch-action: none; user-select: none; cursor: grab; transition: transform 0.15s ease, box-shadow 0.15s ease; }
.rowArmed { transform: scale(1.03); box-shadow: 0 6px 16px rgba(33,32,28,0.18); background: var(--accent-soft); border-color: var(--accent-text); z-index: 10; position: relative; }
.uncatTitle { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queueList { display: flex; flex-direction: column; gap: 4px; }
.dragRowList { display: flex; flex-direction: column; gap: 4px; }
.dragRow { display: flex; align-items: center; gap: 2px; transition: transform 0.18s ease; }
.dragRowActive { transition: none; }
.dragRowActive .queueRow { box-shadow: 0 6px 14px rgba(33,32,28,0.14); background: var(--card, #fff); border-radius: 8px; }
.dragRowHandle { flex-shrink: 0; width: 20px; height: 32px; border: none; background: transparent; color: var(--ink-soft, #85837A); cursor: grab; display: flex; align-items: center; justify-content: center; touch-action: none; }
.longPressRow { touch-action: none; user-select: none; cursor: grab; }
.longPressRow:active { cursor: grabbing; }
.dragRowHandle:active { cursor: grabbing; color: var(--ink, #21201C); }
.dragRowContent { flex: 1; min-width: 0; }
.queueRow { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; background: var(--paper, #F3F1EC); }
.queueRowFront { background: var(--accent-soft, #E4F0EE); }
.queueIdx { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft, #85837A); width: 14px; }
.queueTitle { font-size: 13px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queueActions { display: flex; gap: 2px; }
.tinyIcon { width: 24px; height: 24px; border: none; background: transparent; color: var(--ink-soft, #85837A); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.tinyIcon:disabled { opacity: 0.3; cursor: default; }
.tinyIcon:hover:not(:disabled) { background: var(--card); color: var(--ink, #21201C); }
.newCatRow { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line, #E4E1D6); }
.backupRow { display: flex; gap: 10px; }
.catList { display: flex; flex-direction: column; gap: 6px; }
.catListRow { display: flex; align-items: center; gap: 9px; width: 100%; background: var(--card, #fff); border: 1px solid var(--line, #E4E1D6); border-radius: 12px; padding: 12px 12px; cursor: pointer; text-align: left; font-family: 'Inter', sans-serif; }
.catChildList { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 0 20px; padding-left: 12px; border-left: 2px solid var(--line); }
.catChildRow { padding: 9px 10px; }
.catListRow:hover { border-color: var(--accent, #2B6F6A); }
.draggableTaskRow { margin-bottom: 6px; touch-action: none; user-select: none; cursor: grab; transition: transform 0.15s ease, box-shadow 0.15s ease; }
.draggableTaskRow:active { cursor: grabbing; }
.manageCatHead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.themeGroup { margin-bottom: 18px; }
.themeGroup:last-child { margin-bottom: 4px; }
.themeGroupLabel { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-soft, #85837A); margin: 0 0 8px; }
.themeList { display: flex; flex-direction: column; gap: 6px; }
.themeRow { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card, #fff); border: 1.5px solid var(--line, #E4E1D6); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; font-family: 'Inter', sans-serif; }
.themeRow:hover { border-color: var(--ink-soft, #85837A); }
.themeRowActive { background: var(--paper, #F3F1EC); }
.themeSwatchPair { display: flex; width: 38px; height: 22px; border-radius: 7px; overflow: hidden; border: 1px solid rgba(33,32,28,0.1); flex-shrink: 0; }
.themeSwatchPair span { flex: 1; }
.themeRowName { flex: 1; font-size: 13.5px; font-weight: 500; color: var(--ink, #21201C); }
`;
